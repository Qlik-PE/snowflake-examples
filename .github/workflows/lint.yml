name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SQL checks
        run: python scripts/lint_sql.py

      - name: Python checks (ruff)
        run: |
          pip install ruff
          ruff check .
