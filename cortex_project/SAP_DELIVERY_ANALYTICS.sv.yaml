verified_queries:
- name: late_deliveries_by_region
  sql: SELECT REGION__REGIO, COUNT(*) AS late_deliveries, AVG(GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF)
    AS avg_delay_days FROM sales_delivery_header WHERE GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 GROUP BY REGION__REGIO ORDER BY late_deliveries DESC
  question: Which regions have the most late deliveries and what is their average
    delay?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: monthly_late_delivery_rate_trend
  sql: SELECT DATE_TRUNC('MONTH', DELIVERY_DATE__LFDAT) AS delivery_month, COUNT(*)
    AS total_deliveries, SUM(CASE WHEN GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF > 0
    THEN 1 ELSE 0 END) AS late_deliveries, ROUND(100.0 * SUM(CASE WHEN GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS late_delivery_pct FROM sales_delivery_header
    GROUP BY delivery_month ORDER BY delivery_month
  question: What is the monthly trend of late delivery rate?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: late_deliveries_by_shipping_point_and_region
  sql: SELECT SHIPPING_POINT__VSTEL, REGION__REGIO, COUNT(*) AS late_count, AVG(GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF)
    AS avg_delay FROM sales_delivery_header WHERE GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 GROUP BY SHIPPING_POINT__VSTEL, REGION__REGIO ORDER BY late_count DESC
  question: Which shipping points and regions have the highest number of late deliveries
    and what is their average delay?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: worst_delay_routes
  sql: SELECT ROUTE_ID__ROUTE, COUNT(*) AS deliveries, AVG(GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF)
    AS avg_delay_days FROM sales_delivery_header WHERE GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 GROUP BY ROUTE_ID__ROUTE ORDER BY avg_delay_days DESC LIMIT 20
  question: Which delivery routes have the worst average delay?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: monthly_late_deliveries_by_region
  sql: SELECT REGION__REGIO, DATE_TRUNC('MONTH', DELIVERY_DATE__LFDAT) AS delivery_month,
    COUNT(*) AS late_deliveries, AVG(GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF) AS avg_delay
    FROM sales_delivery_header WHERE GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF > 0 GROUP
    BY REGION__REGIO, delivery_month ORDER BY REGION__REGIO, delivery_month
  question: What are the monthly trends for late deliveries and average delay by region?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: late_deliveries_by_material_group
  sql: SELECT li.MATERIAL_GROUP__MATKL, COUNT(*) AS late_items, AVG(li.GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF)
    AS avg_delay FROM sales_delivery_line_items AS li WHERE li.GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 GROUP BY li.MATERIAL_GROUP__MATKL ORDER BY late_items DESC LIMIT 15
  question: Which material groups have the highest number of late deliveries and what
    is their average delay?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: customers_most_affected_by_late_deliveries
  sql: SELECT c.NAME_1__NAME1 AS customer_name, c.REGION__REGIO, COUNT(*) AS late_deliveries
    FROM sales_delivery_line_items AS li JOIN customer_master AS c ON li.HDR__CUSTOMER_MASTER___0CUSTOMER_ATTR_KEY_ID
    = c.HDR__CUSTOMER_MASTER___0CUSTOMER_ATTR_KEY_ID WHERE li.GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF
    > 0 GROUP BY c.NAME_1__NAME1, c.REGION__REGIO ORDER BY late_deliveries DESC LIMIT
    10
  question: Which customers are most affected by late deliveries?
  verified_at: 1786650267
  verified_by: Semantic Model Generator
  use_as_onboarding_question: false
- name: customers_highest_share_late_deliveries
  question: Which customers or customer groups experienced the highest share of late
    deliveries?
  sql: SELECT h."CUSTOMER_GROUP__KDGRP" AS customer_group, h."NAME_1__NAME1" AS customer_name,
    COUNT(*) AS total_deliveries, SUM(CASE WHEN h."GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF"
    > 0 THEN 1 ELSE 0 END) AS late_deliveries, ROUND(100.0 * SUM(CASE WHEN h."GOODS_ISSUE_DELAY_IN_DAYS__WA_DELAY_LF"
    > 0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS late_delivery_pct FROM CORTEX_DEMOS.PUBLIC."Sales_Delivery_Header"
    h GROUP BY h."CUSTOMER_GROUP__KDGRP", h."NAME_1__NAME1" HAVING COUNT(*) >= 5 ORDER
    BY late_delivery_pct DESC LIMIT 20