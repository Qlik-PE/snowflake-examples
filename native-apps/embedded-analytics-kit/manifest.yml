manifest_version: 1

version:
  name: "1.0"
  label: "Embedded Analytics Starter Kit v1.0"
  comment: "Qlik + Snowflake embedded analytics with Cortex Agent, Semantic View, and MCP integration"

artifacts:
  setup_script: setup_script.sql
  default_streamlit: null

privileges:
  - CREATE SEMANTIC VIEW:
      description: "Create semantic views for Cortex Analyst text-to-SQL"
  - CREATE AGENT:
      description: "Create a Cortex Agent wired to both Semantic View and Qlik MCP"

references:
  - consumer_warehouse:
      label: "Warehouse"
      description: "Warehouse for query execution and agent orchestration"
      privileges:
        - USAGE
      object_type: WAREHOUSE
      register_callback: core.register_reference
